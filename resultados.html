<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados • URNA ARACI</title><style>body{font-family:Arial;background:#d5d5d1;padding:20px}.w{max-width:1000px;margin:auto}.box,.r{background:#eee;border:1px solid #999;border-radius:10px;padding:16px;margin-bottom:12px}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:55px 1fr 50px;padding:8px 0;border-bottom:1px solid #ccc}.v{text-align:right;font-weight:bold}@media(max-width:600px){.rooms{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="box"><h1>URNA ARACI</h1>Resultados da simulação escolar</div><div id="app">Carregando...</div></div><script>const N={"002":"Ana Vitoria","020":"Judite Souza","063":"Eredina","010":"Igor","137":"Regio","004":"Tiago","026":"Andreia","031":"Josiana"};async function load(){try{let r=await fetch("/api/results",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error);let h='<div class="box"><b>Total: '+d.total+' voto(s)</b></div><div class="rooms">';["6º","7º","8º","9º"].forEach(room=>{let o=d.rooms[room]||{},k=Object.keys(o);h+='<section class="r"><h2>'+room+' ano</h2>'+(k.length?k.map(n=>'<div class="row"><b>'+n+'</b><span>'+N[n]+'</span><span class="v">'+o[n]+'</span></div>').join(""):"Nenhum voto ainda.")+'</section>'});document.getElementById("app").innerHTML=h+"</div>"}catch(e){document.getElementById("app").innerHTML='<div class="box">Erro: '+e.message+"</div>"}}load();setInterval(load,2000)</script></body></html>
